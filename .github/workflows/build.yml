name: Build NSOCry Pro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java for bridge validation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify embedded bridge and adapter
        run: |
          python bridge/build.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python bridge/test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/BridgeTests/BridgeTests.csproj -c Release

      - name: Restore
        run: dotnet restore NSOCryPro.sln

      - name: Build
        run: dotnet build NSOCryPro.sln -c Release --no-restore

      - name: Publish
        run: dotnet publish src/NSOCryPro/NSOCryPro.csproj -c Release -r win-x64 --self-contained false -o dist

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NSOCryPro-win-x64
          path: dist
